name: Robot Diario de Analisis de Bolsa

on:
  schedule:
    - cron: '5 18 * * 1-5'
  workflow_dispatch: 

jobs:
  run-analisis:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-cache-dependency-path: 'requirements.txt'
          python-version: '3.10'

      - name: Instalar librerias financieras
        run: |
          pip install yfinance pandas numpy

      - name: Ejecutar el análisis matemático
        run: python robot_diario.py

      - name: Guardar el informe en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add DIARIO_TRADING.md
          git commit -m "Actualización automática del informe diario" || exit 0
          git push
